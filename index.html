<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Test 2Q</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-size: cover;
            background-color: #4a7c9b;
            font-size: 16px;
            display: flex;
            flex-direction: column;
            min-height: 100%;
        }

        main {
            flex: 1;
        }

        #navybary {
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        }

        #pageheader {
            color: white;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }

        #enrollcard {
            background-color: rgba(255, 255, 255, 0.86);
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        footer {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 0;
            background-color: #212529;
            color: white;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" id="navybary">
        <div class="container-fluid">
            <a class="navbar-brand" href="https://obmontessori.edu.ph/">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR1fPjyNg5xFEOtT5wBIhcsb3H__yQMgGnnE6Y-yCOr6VzFjiJQctV9dWo&s=10" alt="OBMC Logo" id="oblogo" class="rounded-circle" style="height: 36px; width: 36px;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar" aria-controls="mynavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mynavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active">Enroll Now</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-primary" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4">
        <div class="row justify-content-center mb-4">
            <div class="col-12 col-md-10 text-center" id="pageheader">
                <div class="d-flex justify-content-center align-items-center gap-3 mb-2">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR1fPjyNg5xFEOtT5wBIhcsb3H__yQMgGnnE6Y-yCOr6VzFjiJQctV9dWo&s=10" alt="OBMC Logo" class="rounded-circle bg-white p-1" style="height: 50px; width: 50px;">
                    <h1 class="h2 mb-0 fw-normal">OBMC Student Enrollment Form</h1>
                </div>
            </div>
        </div>

        <div class="row justify-content-center mb-4">
            <div class="col-12 col-sm-11 col-md-9 col-lg-7">
                <div class="card border-0 p-4" id="enrollcard">
                    <form>
                        <h5 class="fw-bold mb-3">Student Information</h5>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="firstName" class="form-label fs-6">First Name</label>
                                <input type="text" class="form-control" id="firstName" placeholder="Jose" required>
                            </div>
                            <div class="col-md-6">
                                <label for="lastName" class="form-label fs-6">Last Name</label>
                                <input type="text" class="form-control" id="lastName" placeholder="Castillo" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label for="birthDate" class="form-label fs-6">Birth Date</label>
                                <input type="date" class="form-control" id="birthDate" required>
                            </div>
                            <div class="col-md-4">
                                <label for="gender" class="form-label fs-6">Gender</label>
                                <select class="form-select" id="gender" required>
                                    <option value="" selected disabled>Select...</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="gradeLevel" class="form-label fs-6">Grade Level</label>
                                <select class="form-select" id="gradeLevel" required>
                                    <option value="" selected disabled>Select...</option>
                                    <option value="Casa">Junior Casa</option>
                                    <option value="Casa">Senior Casa</option>
                                    <option value="Grade 1">Grade 1</option>
                                    <option value="Grade 2">Grade 2</option>
                                    <option value="Grade 3">Grade 3</option>
                                    <option value="Grade 4">Grade 4</option>
                                    <option value="Grade 5">Grade 5</option>
                                    <option value="Grade 6">Grade 6</option>
                                    <option value="Grade 7">Grade 7</option>
                                    <option value="Grade 8">Grade 8</option>
                                    <option value="Grade 9">Grade 9</option>
                                    <option value="Grade 10">Grade 10</option>
                                    <option value="Grade 11">Grade 11</option>
                                    <option value="Grade 12">Grade 12</option>
                                </select>
                            </div>
                        </div>

                        <h5 class="fw-bold mb-3">Contact Details</h5>
                        <div class="mb-3">
                            <label for="emailAddress" class="form-label fs-6">Email Address</label>
                            <input type="email" class="form-control" id="emailAddress" placeholder="anthonycoolness@gmail.com" required>
                        </div>
                        <div class="mb-4">
                            <label for="contactNumber" class="form-label fs-6">Contact Number</label>
                            <input type="tel" class="form-control" id="contactNumber" placeholder="0123-456-7891" required>
                        </div>

                        <h5 class="fw-bold mb-3">Other Information</h5>
                        <div class="mb-3">
                            <label class="form-label fs-6 d-block">Mode of Learning</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="learningMode" id="modeOnline" value="Online" required>
                                <label class="form-check-label fs-6" for="modeOnline">Online</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="learningMode" id="modeF2F" value="Face-to-Face">
                                <label class="form-check-label fs-6" for="modeF2F">Face-to-Face</label>
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="confirmCheck" required>
                            <label class="form-check-label fs-6" for="confirmCheck">
                                I  that the information provided is true and complete.
                            </label>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-primary px-4 py-2">Submit Enrollment</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p class="mb-0">&copy; 2026 Student Enrollment Page | Nico Crispino | 9-Jade</p>
    </footer>
</body>
</html>
